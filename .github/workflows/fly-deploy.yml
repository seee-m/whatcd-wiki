name: Deploy to Fly.io

on:
  push:
    branches:
      - main
    # A push whose diff is confined to these paths can't change what's
    # actually deployed (the Dockerfile only COPYs api/ and web/), so
    # there's nothing worth a real Fly deploy/restart over.
    paths-ignore:
      - '.gitignore'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
