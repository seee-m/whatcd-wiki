# app name must be globally unique on Fly -- change if "whatcd-wiki" is taken
# (fly launch will offer to rename it interactively the first time).
app = "whatcd-wiki"
primary_region = "lhr"

[build]

[env]
  PORT = "4000"
  SQLITE_PATH = "/data/whatcd.sqlite"

[[mounts]]
  source = "whatcd_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
