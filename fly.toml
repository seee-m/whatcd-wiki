# Named whatcd-wiki-ob-ssg (Fly auto-suffixed it) via the GitHub launcher,
# region ams -- matching the actual deployed app so `fly deploy` from here
# stays consistent with it instead of fighting the launcher's choices.
app = "whatcd-wiki-ob-ssg"
primary_region = "ams"

[build]

[env]
  PORT = "4000"
  SQLITE_PATH = "/data/whatcd.sqlite"

[[mounts]]
  source = "whatcd_data"
  destination = "/data"
  # Only used if the volume needs recreating -- the launcher ignored this
  # and made a 1GB volume, since too small for the 3.9GB db; see the
  # `fly volumes extend` step in the deploy notes.
  initial_size = 10

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
